name: Hokejbal
options:
  bundleIdPrefix: cz.hokejbal
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: cs
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    ENABLE_MODULE_VERIFIER: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
attributes:
  LastUpgradeCheck: "2660"
targets:
  Hokejbal:
    type: application
    platform: iOS
    sources:
      # Assets.xcassets musí být ve sources (ne excluded) — XcodeGen 2.45
      # jinak assety vůbec nepřibalí do appky.
      - path: Hokejbal
        excludes:
          - "Resources/Brand/**"
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.hokejbal.app
        INFOPLIST_KEY_CFBundleDisplayName: Hokejbal
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPad multitasking vyžaduje všechny orientace, nebo Requires Full Screen.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Volitelné upozornění na góly a výsledky oblíbených týmů."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Vyber fotku pro svou profilovku."
        # Opt-out z iOS 26 Liquid Glass — pevný design (bílá / červená) bez glass chrome.
        INFOPLIST_FILE: Hokejbal/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Hokejbal:
    build:
      targets:
        Hokejbal: all
